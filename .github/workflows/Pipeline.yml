name: EMPE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

env:
  IMAGE_NAME: devops-team3
  CONTAINER_NAME: devops-team3
  REGISTRY: 10.0.40.171:5000
  SONAR_HOST_URL: http://10.0.40.165:9000
  SONAR_PROJECT_KEY: Devops-Team3-key
  DOCS_NAME: devops-team3-docs
  DOCS_TAG: 0.0.${{ github.run_number }}

jobs:
  build:
    runs-on: self-hosted

    steps:

      - name: Fix workspace permissions
        run: |
          docker run --rm \
            -v "$PWD":/project \
            bash:5.2 \
            bash -c "chown -R $(id -u):$(id -g) /project"

      - name: Checkout repository
        uses: actions/checkout@v4

      # Generates the PDF from the markdown files (before app build and docs image)
      - name: Generate PDF documentation
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD":/data \
            pandoc/latex \
            mkdocs/docs/index.md \
            mkdocs/docs/lecture1.md \
            mkdocs/docs/lecture2.md \
            mkdocs/docs/lecture3.md \
            mkdocs/docs/lecture4.md \
            mkdocs/docs/lecture5.md \
            mkdocs/docs/lecture6.md \
            -o mkdocs/docs/documentation.pdf \
            --toc -V lang=de

      # Copies the PDF into the app, so Spring Boot serves it
      - name: Copy PDF to application
        run: |
          mkdir -p src/main/resources/static
          cp mkdocs/docs/documentation.pdf src/main/resources/static/

      - name: Build application
        run: |
          docker run --rm -u gradle \
            -v "$PWD:/home/gradle/project" \
            -w /home/gradle/project \
            gradle:8-jdk17-alpine \
            gradle build

      - name: SonarQube analysis
        run: |
          docker run --rm -u 1000 \
            -e SONAR_HOST_URL="$SONAR_HOST_URL" \
            -e SONAR_TOKEN="${{ secrets.SONAR_TOKEN }}" \
            -v "$PWD:/usr/src" \
            sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey=$SONAR_PROJECT_KEY \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.java.binaries=build/classes/java/main \
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:latest .

      - name: Stop and remove old container
        run: |
          docker stop $CONTAINER_NAME || true
          docker rm $CONTAINER_NAME || true

      - name: Start container
        run: |
          docker run -d \
            --name $CONTAINER_NAME \
            --restart unless-stopped \
            -p 8080:8080 \
            $IMAGE_NAME:latest

      - name: Integration test
        run: |
          if curl -f http://localhost:8080/hello; then
            echo "Integration test successful"
            exit 0
          fi

          echo "Endpoint not reachable yet. Waiting 10 seconds..."
          sleep 10

          if curl -f http://localhost:8080/hello; then
            echo "Integration test successful"
            exit 0
          else
            echo "Integration test failed"
            exit 1
          fi

      - name: Tag Docker image
        run: |
          docker tag $IMAGE_NAME:latest $REGISTRY/$IMAGE_NAME:latest
          docker tag $IMAGE_NAME:latest $REGISTRY/$IMAGE_NAME:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:latest
          docker push $REGISTRY/$IMAGE_NAME:${{ github.sha }}

      # Generates the HTML documentation from mkdocs/ into mkdocs/site
      - name: Build documentation
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD/mkdocs":/docs \
            squidfunk/mkdocs-material build

      # Builds the nginx image from mkdocs/Dockerfile (copies mkdocs/site into the image)
      - name: Build docs image
        run: docker build -t $DOCS_NAME:$DOCS_TAG mkdocs

      # Stops and removes the old docs instance ('|| true': must not fail if none exists)
      - name: Stop and remove old docs container
        run: |
          docker stop $DOCS_NAME || true
          docker rm $DOCS_NAME || true

      # Starts the docs container on a different port than the app (8080)
      - name: Deploy docs container
        run: |
          docker run -d \
            --name $DOCS_NAME \
            --restart unless-stopped \
            -p 8081:80 \
            $DOCS_NAME:$DOCS_TAG

      - name: Push docs image to Registry
        run: |
          docker tag $DOCS_NAME:$DOCS_TAG $REGISTRY/$DOCS_NAME:$DOCS_TAG
          docker push $REGISTRY/$DOCS_NAME:$DOCS_TAG